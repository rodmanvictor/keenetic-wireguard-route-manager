name: Build release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-15
            platform: macos-arm64
            macos_arch: arm64
          - os: macos-15-intel
            platform: macos-x86_64
            macos_arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Flutter for macOS
        if: runner.os == 'macOS'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.8"
          architecture: ${{ matrix.macos_arch }}
          cache: true
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build standalone CLI
        run: python scripts/build-cli.py
      - name: Build desktop application
        run: python scripts/build-desktop.py
        env:
          PACKETECH_MACOS_ARCH: ${{ matrix.macos_arch }}
      - name: Archive native applications
        if: runner.os == 'Linux'
        run: python scripts/package-linux.py
      - name: Archive native Windows applications
        if: runner.os == 'Windows'
        run: python scripts/package-windows.py
      - name: Archive native macOS application
        if: runner.os == 'macOS'
        run: python scripts/package-macos.py
      - uses: actions/upload-artifact@v4
        with:
          name: packetech-${{ matrix.platform }}
          path: dist/release/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
