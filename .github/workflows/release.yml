name: Build release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: "1"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build standalone CLI
        run: python scripts/build-cli.py
      - name: Build desktop application
        run: python scripts/build-desktop.py
      - name: Archive native applications
        run: python scripts/package-linux.py
      - uses: actions/upload-artifact@v4
        with:
          name: paketych-linux
          path: |
            dist/release/*.deb
            dist/release/*.tar.gz
            dist/release/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
