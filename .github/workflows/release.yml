name: Build release

"on":
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
      FLET_CLI_NO_RICH_OUTPUT: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            flet_target: linux
          - os: windows-latest
            platform: windows
            flet_target: windows
          - os: macos-26-intel
            platform: macos
            flet_target: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Linux desktop toolchain
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - name: Install build dependencies
        run: python -m pip install -r requirements-dev.txt -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - name: Build standalone CLI
        run: python scripts/build-cli.py
      - name: Build desktop application
        run: >-
          flet build ${{ matrix.flet_target }} .
          --module-name desktop_app
          --project keenetic-router
          --artifact keenetic-router
          --product "Keenetic Route Manager"
          --org ru.rodman
          --description "Selective WireGuard routing for KeeneticOS"
          --output dist/desktop
          --python-version 3.12
          --no-rich-output
          --yes
      - name: Archive native applications
        run: python scripts/package-release.py --platform ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        with:
          name: keenetic-route-manager-${{ matrix.platform }}
          path: dist/release/*.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*.zip
